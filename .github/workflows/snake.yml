name: Contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#13213b&color_dots=#ebedf0,#c8d0db,#9aa6b8,#5d6b82,#13213b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c3d0e6&color_dots=#161b22,#2a3f63,#4a5f85,#8a97ab,#c3d0e6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
